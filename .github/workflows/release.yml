name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check-chords.cjs
      - name: Package device
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          files = [
          'Chord Generator.amxd',
          'chord_generator.js',
          'chord_progressions.js',
          'chord_select.js',
          'chord_action.js',
          'chord-progressions-LICENSE.txt',
          'README.md'
          ]
          with ZipFile('device.zip', 'w', ZIP_DEFLATED) as z:
              for f in files:
                  z.write(f)
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" device.zip --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REPOSITORY#*/} ${GITHUB_REF_NAME}" --generate-notes
